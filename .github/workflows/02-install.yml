name: 02 - Dependencies and Build Artifact

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dependency-installation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Show Python Version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Verify Dependencies
        run: pip check

      - name: Test Application
        run: python app.py

      - name: Create Production ZIP
        run: |
          mkdir build
          cp app.py build/
          cp requirements.txt build/
          zip -r production-build.zip build/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-temp
          path: production-build.zip
          retention-days: 1

  store-production-build:
    needs: dependency-installation
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output-temp

      - name: Upload as Production Build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: production-build.zip
          retention-days: 5
