name: 01 - Setup & Checkout

# Manual trigger only, so it can be run on-demand from the Actions tab during the demo
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code so the runner has access to project files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the Python runtime needed for the project
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Verify the environment is correctly configured
      - name: Verify Python installation
        run: |
          echo "Checking Python and pip versions..."
          python --version
          pip --version
